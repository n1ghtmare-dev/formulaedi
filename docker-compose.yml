# Локальная инфраструктура для разработки: MySQL (MariaDB) + Redis.
# Запуск: docker compose up -d
services:
  db:
    image: mariadb:11
    container_name: formulaedi-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: formulaedi
      MARIADB_USER: formulaedi
      MARIADB_PASSWORD: formulaedi
      MARIADB_ROOT_PASSWORD: formulaedi
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: formulaedi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data:
