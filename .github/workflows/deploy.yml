name: Deploy formulaedi.ru

# По пушу в main (или вручную) раннер GitHub заходит на сервер по SSH (пароль),
# выполняет deploy/remote-bootstrap.sh (диагностика + клон + сборка + миграции + PM2),
# сохраняет весь вывод в deploy/last-run.log и коммитит его обратно в репозиторий —
# чтобы результат можно было прочитать без доступа к Actions-логам.
#
# Секреты: SSH_HOST, SSH_USER, SSH_PORT, SSH_PASSWORD, DEPLOY_PATH (необязателен).

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/last-run.log'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-formulaedi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: SSH → bootstrap/deploy + capture log
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
          HOST: ${{ secrets.SSH_HOST }}
          SUSER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set +x
          {
            echo "===== ЗАПУСК $(date -u '+%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA::7} ====="
          } > deploy/last-run.log
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            -p "${PORT:-22}" "${SUSER}@${HOST}" \
            "bash -s -- '${DEPLOY_PATH}'" < deploy/remote-bootstrap.sh \
            >> deploy/last-run.log 2>&1 || echo ">>> SSH-сессия завершилась с ошибкой (см. выше — возможно закрыт парольный вход или неверные секреты)" >> deploy/last-run.log
          echo "===== КОНЕЦ =====" >> deploy/last-run.log
          echo "--- превью лога в Actions ---"; tail -40 deploy/last-run.log

      - name: Commit log back
        if: always()
        run: |
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add deploy/last-run.log
          git commit -m "deploy: last-run.log [skip ci]" || { echo "нет изменений"; exit 0; }
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
