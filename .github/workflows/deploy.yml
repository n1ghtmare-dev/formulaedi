name: Deploy PROD (formulaedi.ru)

# Выкатка на боевой сервер 192.168.33.3 (FastPanel, LAN).
#
# Раннер — SELF-HOSTED и стоит НА САМОМ СЕРВЕРЕ, под пользователем formulaedi.
# Поэтому деплой полностью локальный: ни SSH, ни ключей, ни паролей в секретах.
# Раннер сам достучится до GitHub наружу по HTTPS — входящие порты открывать не надо.
#
# ВАЖНО: на этой же машине живёт боевой yesbeat.ru (~20 ТБ медиа) и ещё ~25 сайтов.
# Всё, что делает деплой, происходит строго внутри PROD_DEPLOY_PATH. У пользователя
# formulaedi нет sudo, за пределы своего домашнего каталога он и не дотянется.
#
# Триггеры:
#   push в ветку prod  -> реальная выкатка (apply). Т.е. деплой = merge main -> prod.
#   workflow_dispatch  -> ручной запуск, по умолчанию dry-run (ничего не пишет).
#
# Защита:
#   - перед записью снимается дамп MySQL; пустой дамп -> деплой отменяется;
#   - код обновляется git reset'ом внутри своего каталога, никаких rsync --delete;
#   - после выкатки гоняется tests/smoke.sh — если сайт не ожил, джоб красный.
#
# Секреты репозитория: PROD_DEPLOY_PATH.

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка/коммит для выкатки'
        required: false
        default: 'prod'
      mode:
        description: 'dry-run = только показать | apply = реальная выкатка'
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

concurrency:
  group: deploy-formulaedi-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, formulaedi]

    env:
      TARGET_REF: ${{ github.event.inputs.ref || 'prod' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Определить режим (push=apply, ручной=выбор)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "MODE=apply" >> "$GITHUB_ENV"
          else
            echo "MODE=${{ github.event.inputs.mode }}" >> "$GITHUB_ENV"
          fi

      - name: Выкатка (${{ env.MODE }})
        run: bash deploy/remote-deploy.sh "${{ secrets.PROD_DEPLOY_PATH }}" "$MODE" "origin/$TARGET_REF"

      # Ходим по домену, но через 127.0.0.1 — чтобы проверять весь путь целиком
      # (Nginx -> обратный прокси -> Node), а не только Node напрямую. И чтобы
      # проверка не зависела от того, переехал ли уже DNS.
      - name: Smoke (только apply)
        if: ${{ env.MODE == 'apply' }}
        env:
          BASE_URL: http://127.0.0.1
          HOST_HDR: formulaedi.ru
        run: bash tests/smoke.sh
