name: Deploy PROD (formulaedi.ru)

# Выкатка на боевой сервер. Раннер — ОБЛАЧНЫЙ (ubuntu-latest), ходит по SSH.
#
# Почему это работает, хотя сервер в LAN: снаружи проброшен порт 50222, он
# приземляется на sshd сервера (проверено с облачного раннера — баннер совпал).
# Сам порт 22 снаружи закрыт, внутренний адрес 192.168.33.3 из интернета недоступен.
#
# Вход — по ключу. Пароли не используются.
#
# ВАЖНО: на этой же машине живёт боевой yesbeat.ru (~20 ТБ медиа) и ещё ~25 сайтов.
# Всё, что делает деплой, происходит строго внутри PROD_DEPLOY_PATH. У пользователя
# formulaedi нет sudo, за пределы своего домашнего каталога он не дотянется.
#
# Триггеры:
#   push в ветку prod  -> реальная выкатка (apply). Т.е. деплой = merge main -> prod.
#   workflow_dispatch  -> ручной запуск, по умолчанию dry-run (ничего не пишет).
#
# Защита:
#   - перед записью снимается дамп MySQL; пустой дамп -> деплой отменяется;
#   - код обновляется git reset'ом внутри своего каталога, никаких rsync --delete;
#   - после выкатки гоняется tests/smoke.sh — если сайт не ожил, джоб красный.
#
# Секреты: PROD_SSH_HOST, PROD_SSH_PORT, PROD_SSH_USER, PROD_DEPLOY_PATH, PROD_SSH_KEY.

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка/коммит для выкатки'
        required: false
        default: 'prod'
      mode:
        description: 'dry-run = только показать | apply = реальная выкатка'
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

concurrency:
  group: deploy-formulaedi-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TARGET_REF: ${{ github.event.inputs.ref || 'prod' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Определить режим (push=apply, ручной=выбор)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "MODE=apply" >> "$GITHUB_ENV"
          else
            echo "MODE=${{ github.event.inputs.mode }}" >> "$GITHUB_ENV"
          fi

      - name: Ключ и known_hosts
        env:
          KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Пин по ключу хоста: защищает от подмены сервера на пути.
          ssh-keyscan -t ed25519 -p "${{ secrets.PROD_SSH_PORT }}" \
            "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts || { echo "не удалось получить ключ хоста — сервер недоступен?"; exit 1; }

      - name: Проверить связь
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            -p "${{ secrets.PROD_SSH_PORT }}" \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            'echo "связь есть: $(whoami)@$(hostname)"'

      - name: Выкатка (${{ env.MODE }})
        env:
          # Секреты PayKeeper из GitHub Actions. remote-deploy впишет их в .env на сервере.
          PK_SERVER: ${{ secrets.PAYKEEPER_SERVER }}
          PK_USER: ${{ secrets.PAYKEEPER_USER }}
          PK_PASSWORD: ${{ secrets.PAYKEEPER_PASSWORD }}
          PK_SECRET: ${{ secrets.PAYKEEPER_SECRET }}
        run: |
          # Блок KEY=VALUE строк → base64 (безопасно для кавычек/спецсимволов в пароле и секрете).
          PK_ENV_B64=$(printf 'PAYKEEPER_SERVER=%s\nPAYKEEPER_USER=%s\nPAYKEEPER_PASSWORD=%s\nPAYKEEPER_SECRET=%s\n' \
            "$PK_SERVER" "$PK_USER" "$PK_PASSWORD" "$PK_SECRET" | base64 -w0)
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            -p "${{ secrets.PROD_SSH_PORT }}" \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "PK_ENV_B64='$PK_ENV_B64' bash -s -- '${{ secrets.PROD_DEPLOY_PATH }}' '$MODE' 'origin/$TARGET_REF'" \
            < deploy/remote-deploy.sh

      # По домену и по HTTPS — ровно так, как сайт видит живой пользователь:
      # DNS -> Nginx -> TLS -> обратный прокси -> Node.
      - name: Smoke (только apply)
        if: ${{ env.MODE == 'apply' }}
        env:
          BASE_URL: https://formulaedi.ru
        run: bash tests/smoke.sh

      - name: Убрать ключ
        if: always()
        run: rm -f ~/.ssh/deploy_key
