name: ВРЕМЕННО — проверка доступности сервера снаружи

# Одноразовая проверка: достучится ли облачный раннер GitHub до сервера по SSH.
# Изнутри LAN это проверить невозможно (NAT-хэрпиннинг даёт ложный отрицательный
# результат), а от ответа зависит, можно ли вообще отказаться от self-hosted раннера.
#
# Ничего не меняет, только пробует открыть TCP-соединение.
# УДАЛИТЬ после получения ответа.

on:
  push:
    branches: [ci/self-hosted-pipeline]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: TCP до сервера
        env:
          H: ${{ secrets.PROD_PUBLIC_HOST }}
          P: ${{ secrets.PROD_PUBLIC_PORT }}
        run: |
          echo "== проброшенный порт =="
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$H/$P" 2>/dev/null; then
            echo "ДОСТУПЕН — облачный раннер может ходить на сервер"
            echo "баннер SSH:"
            timeout 10 bash -c "exec 3<>/dev/tcp/$H/$P; head -1 <&3" || true
          else
            echo "НЕДОСТУПЕН — порт закрыт или не проброшен"
          fi

          echo
          echo "== порт 22 на всякий случай =="
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$H/22" 2>/dev/null; then
            echo "22 ДОСТУПЕН"
            timeout 10 bash -c "exec 3<>/dev/tcp/$H/22; head -1 <&3" || true
          else
            echo "22 закрыт"
          fi

          echo
          echo "== HTTP (для контроля, что адрес вообще тот) =="
          curl -s -o /dev/null -m 10 -w "http: %{http_code}\n" "http://$H/" || echo "http: нет ответа"
