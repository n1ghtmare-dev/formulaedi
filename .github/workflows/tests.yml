name: Tests (typecheck + build)

# Гейт перед продом. Гоняется на облачном раннере — серверу ничего не нужно,
# только npm-реестр.
#
#   push/PR в main -> проверяем, что код вообще собирается
#   push/PR в prod -> тот же прогон ПЕРЕД тем, как коммит уедет на боевой
#
# Прод этим воркфлоу не трогается вообще.

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      # Схема Prisma нужна и для typecheck: без сгенерированного клиента
      # у apps/api не сойдутся типы. Обычно клиент генерится postinstall'ом
      # @prisma/client, но на всякий случай делаем это явно.
      - name: prisma generate
        run: npm run db:generate

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      - name: Проверить, что витрина собралась
        run: |
          test -f apps/web/dist/index.html || { echo "нет apps/web/dist/index.html"; exit 1; }
          echo "dist: $(du -sh apps/web/dist | cut -f1)"

  shellcheck:
    name: shellcheck скриптов деплоя
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверить синтаксис bash
        run: |
          for f in deploy/*.sh tests/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" && echo "OK  $f" || { echo "СИНТАКСИС  $f"; exit 1; }
          done
