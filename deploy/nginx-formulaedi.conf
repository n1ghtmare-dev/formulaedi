# Nginx для formulaedi.ru — раздаёт статику витрины и проксирует /api в Node.
# В FastPanel то же самое настраивается через UI сайта: document root = apps/web/dist,
# плюс правило проксирования /api → 127.0.0.1:4000. Этот файл — как ориентир.
#
# SSL (сертификат Let's Encrypt) удобнее выпустить кнопкой в FastPanel — он сам
# допишет listen 443 / ssl_certificate. Ниже — HTTP-вариант до выпуска SSL.

server {
    listen 80;
    server_name formulaedi.ru www.formulaedi.ru;

    root /var/www/formulaedi/apps/web/dist;   # ← поправьте под ваш путь (DEPLOY_PATH/apps/web/dist)
    index index.html;

    # API → Node на 127.0.0.1:4000
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: всё остальное отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш статики
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
